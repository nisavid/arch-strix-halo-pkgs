# Accepted linkage findings for `c_buildroot.py verify`.
#
# verify reads every host-architecture ELF object under /usr/bin, /usr/lib and
# /opt/rocm in the root. It fails on a DT_NEEDED entry that does not resolve
# inside the root, and on a DT_RUNPATH or DT_RPATH entry that is not under
# /usr or /opt/rocm and not relative to $ORIGIN, unless an entry here covers
# the finding. It also fails on any entry here that covers nothing, so remove
# an entry as soon as its finding is gone.
#
# [[needed]]  package, object, soname, reason, optional issue
# [[runpath]] package, object, entry,  reason, optional issue
#
# `package` is the package that owns the object. `object` is an fnmatch
# pattern for the object's path in the root, and `soname` or `entry` is an
# fnmatch pattern for the unresolved soname or the RUNPATH/RPATH directory.
# Use an exact value unless one cause covers a family, and say so in the
# reason. A real defect that must not block the build carries its tracking
# issue. Never add a finding that a correct lock or a package fix should cure.

