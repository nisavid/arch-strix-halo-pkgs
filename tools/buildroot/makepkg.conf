#!/hint/bash
# Pinned makepkg.conf for generation-C builds inside the rootless build root.
#
# `c_buildroot.py enter` binds this file read-only at /etc/makepkg.conf, so
# every root build uses it regardless of the makepkg.conf that the root's
# pacman package ships. It follows the host's CachyOS makepkg.conf, with
# these deliberate choices:
#
# * Parallelism defaults to 6 jobs (MAKEFLAGS, NINJAFLAGS, MAX_JOBS,
#   CMAKE_BUILD_PARALLEL_LEVEL, CARGO_BUILD_JOBS). `enter` runs every build in
#   the host's builds.slice, which caps memory at 32G with no swap, and heavy
#   hipcc units (PyTorch CK GEMM) peak near 4G each. Override per build with
#   `enter --setenv ASHP_BUILD_JOBS=N`; raise it only after a measured
#   memory.peak under 20G.
# * ccache is enabled with a 2G cap. `enter --ccache DIR` binds a shared
#   cache at /ccache; without it the cache lives under the work dir.
# * INTEGRITY_CHECK is b2, like the host (it only affects `makepkg -g`).
#
# PKGDEST and SRCDEST come from `enter --pkgdest/--srcdest`.

DLAGENTS=('file::/usr/bin/curl -qgC - -o %o %u'
          'ftp::/usr/bin/curl -qgfC - --ftp-pasv --retry 3 --retry-delay 3 -o %o %u'
          'http::/usr/bin/curl -qgb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'https::/usr/bin/curl -qgb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'rsync::/usr/bin/rsync --no-motd -z %u %o'
          'scp::/usr/bin/scp -C %u %o')

VCSCLIENTS=('bzr::breezy'
            'fossil::fossil'
            'git::git'
            'hg::mercurial'
            'svn::subversion')

CARCH="x86_64"
CHOST="x86_64-pc-linux-gnu"

CFLAGS="-march=native -O3 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now \
         -Wl,-z,pack-relative-relocs"
LTOFLAGS="-flto=auto"
DEBUG_CFLAGS="-g"
DEBUG_CXXFLAGS="$DEBUG_CFLAGS"

ASHP_BUILD_JOBS="${ASHP_BUILD_JOBS:-6}"
MAKEFLAGS="-j${ASHP_BUILD_JOBS}"
NINJAFLAGS="-j${ASHP_BUILD_JOBS}"
export MAX_JOBS="${ASHP_BUILD_JOBS}"
export CMAKE_BUILD_PARALLEL_LEVEL="${ASHP_BUILD_JOBS}"
export CARGO_BUILD_JOBS="${ASHP_BUILD_JOBS}"
export CCACHE_MAXSIZE="2G"

BUILDENV=(!distcc color ccache check !sign)
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto !autodeps)

INTEGRITY_CHECK=(b2)
STRIP_BINARIES="--strip-all"
STRIP_SHARED="--strip-unneeded"
STRIP_STATIC="--strip-debug"
MAN_DIRS=(usr{,/local}{,/share}/{man,info})
DOC_DIRS=(usr/{,local/}{,share/}{doc,gtk-doc})
PURGE_TARGETS=(usr/{,share}/info/dir .packlist *.pod)
DBGSRCDIR="/usr/src/debug"
LIB_DIRS=('lib:usr/lib' 'lib32:usr/lib32')

COMPRESSGZ=(gzip -c -f -n)
COMPRESSBZ2=(bzip2 -c -f)
COMPRESSXZ=(xz -c -z -)
COMPRESSZST=(zstd -c -T0 -9 -)
COMPRESSLRZ=(lrzip -q)
COMPRESSLZO=(lzop -q)
COMPRESSZ=(compress -c -f)
COMPRESSLZ4=(lz4 -q)
COMPRESSLZ=(lzip -c -f)

PKGEXT='.pkg.tar.zst'
SRCEXT='.src.tar.gz'
