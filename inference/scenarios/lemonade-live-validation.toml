# Lemonade live-validation bar for the standalone Lemonade family.
#
# Every scenario here carries the `validation-window` tag, so broad selections
# skip it unless the operator passes --include-validation-window, selects it by
# --scenario id, or asks for --tag validation-window. `mutates-service` marks
# scenarios that load or unload models on the running lemond.service;
# `isolated-lemond` marks scenarios that start a private lemond with a
# temporary cache directory and leave the service config untouched. Pins,
# budget, and displacement use the isolated lemond because they change pins,
# config, and residency; the service-facing pin check is read-only.
#
# Operator inputs come from the run-time environment, never from this file:
# - `--model-path Qwen/Qwen3-0.6B-GGUF=<testing HF hub cache>/.../Qwen3-0.6B-Q8_0.gguf`
# - `LEMONADE_API_KEY` or `LEMONADE_API_KEY_FILE`, and optionally
#   `LEMONADE_ADMIN_API_KEY` or `LEMONADE_ADMIN_API_KEY_FILE`, when the host's
#   service configuration carries a key. Keys never go in argv or output.
#
# See docs/maintainers/lemonade-live-validation.md for provisioning, the
# operator checklist, and the Kokoro TTS decision.

[[scenario]]
id = "llama.cpp.hip.qwen3-0.6b-q8-0.completion"
