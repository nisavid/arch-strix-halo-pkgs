# The runner has no manual-step support, so the app check is an operator
# checklist in the catalog. The loader ignores this table.
[[operator_checklist]]
id = "lemonade.app.pin-startup-text"
summary = "Operator launches the Lemonade app, exercises its pin and startup controls, and completes one text interaction"
tags = ["live-validation", "validation-window", "lemonade-app", "operator"]
prerequisites = [
  "The lemonade.llamacpp.rocm.qwen3-0.6b-q8-0.completion scenario passed in this validation window.",
  "If the service configuration carries an API key, launch the app with the same LEMONADE_API_KEY environment the service expects.",
  "Record GET /api/v1/pins and GET /api/v1/health before starting so pins and residency can be restored.",
]
steps = [
  "Launch lemonade-app from the desktop session; confirm it connects to the local lemond and shows the installed lemonade-server version.",
  "In Model Manager, load user.Qwen3-0.6B-Q8_0-GGUF, then use its Pin control; confirm GET /api/v1/pins lists it with loaded true.",
  "Confirm the persisted pin is the startup-load control: the service config pinned_models now contains the model.",
  "Use the Unpin control; confirm the model leaves GET /api/v1/pins and the service config pinned_models.",
  "In chat, send one prompt to user.Qwen3-0.6B-Q8_0-GGUF and confirm a text reply renders.",
  "Restore the recorded pins and residency, then close the app.",
]
record = "Record pass or fail per step with the app and lemonade-server package versions in docs/maintainers/current-state.md."
