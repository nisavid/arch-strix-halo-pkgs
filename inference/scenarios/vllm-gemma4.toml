[[scenario]]
id = "vllm.gemma4.26b-a4b.text.basic"
summary = "Gemma 4 26B A4B text-only offline eager smoke with known-answer and long-decode output checks"
tags = ["smoke", "gemma4", "correctness"]

[scenario.given]
engine = "vllm"
model = "google/gemma-4-26B-A4B-it"
tool = "gemma4_text_smoke"

[scenario.when]
argv = ["--known-answer", "--long-decode", "--long-decode-count", "250"]

[scenario.attention_backend]
expected = "TRITON_ATTN"
evidence = "static-prediction"
basis = "vLLM v0.30.0 ced6857a: Gemma4Config forces TRITON_ATTN for all layers because head sizes differ (256 sliding, 512 full) and FA4 is unavailable on ROCm; w2a-validate confirms live"

[[scenario.then.assert]]
kind = "exit_code.equals"
value = 0

[[scenario.then.assert]]
kind = "stdout.contains"
value = "generation_ok"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "basic_ok"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "known_answer_ok"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "long_decode_ok"

[[scenario.then.assert]]
kind = "output.contains"
value = "Using TRITON Unquantized MoE backend"

[[scenario.then.assert]]
kind = "output.contains"
value = "Gemma4 model has heterogeneous head dimensions {'sliding_attention': 256, 'full_attention': 512}. FA4 not available, forcing TRITON_ATTN backend."

[[scenario.then.assert]]
kind = "output.contains"
value = "Using TRITON_ATTN backend (selected via --attention-backend)."

