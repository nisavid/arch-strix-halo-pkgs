[[scenario]]
id = "vllm.pooling.zembed-1.embeddings"
summary = "vLLM pooling embeddings smoke for ZeroEntropy zembed-1 with ROCm FlexAttention"
tags = ["smoke", "vllm", "pooling", "embeddings", "zeroentropy", "zembed", "rocm", "flex-attention"]

[scenario.given]
engine = "vllm"
model = "zeroentropy/zembed-1"
tool = "vllm_pooling_smoke.embeddings"

[scenario.when]
argv = [
  "--attention-backend",
  "FLEX_ATTENTION",
  "--max-model-len",
  "256",
  "--fixture",
  "zeroentropy",
]

[[scenario.then.assert]]
kind = "exit_code.equals"
value = 0

[[scenario.then.assert]]
kind = "stdout.contains"
value = "runner pooling"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "attention_backend FLEX_ATTENTION"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "fixture zeroentropy"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "convert embed"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "embedding_count 3"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "embeddings_finite_ok"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "embedding_ranking_ok"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "embeddings_ok"

[[scenario]]
id = "vllm.pooling.zerank-2.rerank"
summary = "vLLM pooling rerank smoke for ZeroEntropy zerank-2 with ROCm FlexAttention"
tags = ["smoke", "vllm", "pooling", "rerank", "zeroentropy", "zerank", "rocm", "flex-attention"]

[scenario.given]
engine = "vllm"
model = "zeroentropy/zerank-2"
tool = "vllm_pooling_smoke.rerank"

[scenario.when]
argv = [
  "--attention-backend",
  "FLEX_ATTENTION",
  "--max-model-len",
  "512",
  "--fixture",
  "zeroentropy",
]

[[scenario.then.assert]]
kind = "exit_code.equals"
value = 0

[[scenario.then.assert]]
kind = "stdout.contains"
value = "runner pooling"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "attention_backend FLEX_ATTENTION"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "fixture zeroentropy"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "pooling_task classify"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "convert classify"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "classifier_from_token Yes"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "method no_post_processing"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "logit_sigma 5.0"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "score_count 3"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "scores_finite_ok"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "rerank_order_ok"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "rerank_ok"
