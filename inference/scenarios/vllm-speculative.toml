[[scenario]]
id = "vllm.speculative.eagle3.qwen3_6.35b-a3b.server.benchmark-lite"
summary = "Qwen3.6 35B-A3B EAGLE3 speculative decoding benchmark-lite server smoke"
tags = ["vllm", "speculative-decoding", "eagle3", "qwen3.6", "benchmark-lite", "server", "exploratory"]
source_url = "https://huggingface.co/Dogacel/specdrift-qwen3.6-35b-a3b-eagle3"

[scenario.given]
engine = "vllm"
model = "Qwen/Qwen3.6-35B-A3B"
tool = "qwen_server_smoke.benchmark-lite"

[scenario.given.speculative_config]
method = "eagle3"
model = "Dogacel/specdrift-qwen3.6-35b-a3b-eagle3"
num_speculative_tokens = 4

[scenario.when]
argv = ["--max-model-len", "2048"]

[[scenario.then.assert]]
kind = "exit_code.equals"
value = 0

[[scenario.then.assert]]
kind = "stdout.contains"
value = "server_ready"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "benchmark_lite_ok"

[[scenario.then.assert]]
kind = "stdout.contains"
value = "\"method\":\"eagle3\""

[[scenario]]
id = "vllm.speculative.eagle3.qwen3_6.35b-a3b-nvfp4.server.benchmark-lite"
summary = "Qwen3.6 35B-A3B NVFP4 EAGLE3 speculative decoding probe blocked by ROCm ModelOpt FP4 support"
tags = ["vllm", "speculative-decoding", "eagle3", "qwen3.6", "nvfp4", "modelopt", "benchmark-lite", "server", "exploratory", "blocked"]
source_url = "https://huggingface.co/Dogacel/specdrift-qwen3.6-35b-a3b-eagle3"

[scenario.given]
engine = "vllm"
model = "RedHatAI/Qwen3.6-35B-A3B-NVFP4"
tool = "qwen_server_smoke.benchmark-lite"

[scenario.given.speculative_config]
method = "eagle3"
model = "Dogacel/specdrift-qwen3.6-35b-a3b-eagle3"
num_speculative_tokens = 4

[scenario.when]
argv = ["--quantization", "modelopt_fp4", "--max-model-len", "2048"]

[[scenario.then.assert]]
kind = "exit_code.equals"
value = 1

[[scenario.then.assert]]
kind = "output.contains"
value = "modelopt_fp4 quantization is currently not supported in rocm."

